name: Visual baselines

# Run by hand after an intended visual change: renders the screenshot baselines on Linux (as CI
# compares them) and uploads them to download and commit under e2e/__screenshots__.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baselines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test --project=visual --update-snapshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines-linux
          path: e2e/__screenshots__/*-linux.png
